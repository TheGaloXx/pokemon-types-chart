<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Types Chart Test</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="title">
            <h1>Pokémon <span>Types Chart</span> Test</h1>
        </div>
        <div class="actions">
            <button id="btn-reset" class="secondary">Reset</button>
            <button id="btn-done">Done</button>
        </div>
    </header>

    <div class="legend">
        <span class="item"><span class="swatch" style="background:var(--m2)"></span>×2 Super Effective</span>
        <span class="item"><span class="swatch" style="background:var(--m1)"></span>×1 Neutral</span>
        <span class="item"><span class="swatch" style="background:var(--m05)"></span>×0.5 Not Very Effective</span>
        <span class="item"><span class="swatch" style="background:var(--m0)"></span>×0 Immune</span>
    </div>

    <div class="grid-wrap">
        <div class="grid" id="grid"></div>
    </div>

    <div class="modal-overlay hidden" id="modal">
        <div class="modal">
            <div class="modal-head">
                <span class="chip" id="m-atk"></span>
                <span class="arrow">→</span>
                <span class="chip" id="m-def"></span>
            </div>
            <p class="modal-question" id="modal-q"></p>
            <div class="modal-options">
                <button class="opt opt-2" data-v="2"><b>×2</b><span>Super Effective</span></button>
                <button class="opt opt-1" data-v="1"><b>×1</b><span>Neutral</span></button>
                <button class="opt opt-05" data-v="0.5"><b>×0.5</b><span>Not Very Effective</span></button>
                <button class="opt opt-0" data-v="0"><b>×0</b><span>Immune</span></button>
            </div>
        </div>
    </div>

    <div class="results-overlay hidden" id="results">
        <div class="results">
            <h2>Results</h2>
            <div class="results-card">
                <div class="score-block">
                    <div class="score-big"><b id="res-correct">0</b><span class="score-total">/ <span id="res-total"></span></span></div>
                    <div class="score-pct" id="res-pct"></div>
                    <div class="score-comment" id="res-comment"></div>
                </div>
                <div class="results-body">
                    <div class="errors-col">
                        <h3 class="errors-head">Errors</h3>
                        <ul class="mistakes" id="mistakes"></ul>
                    </div>
                    <div class="results-right">
                        <div class="img-wrap"><img id="grid-img" alt="Type chart"></div>
                        <button id="btn-download">Download PNG</button>
                    </div>
                </div>
                <div class="results-foot">
                    <button id="btn-play-again">Reset &amp; Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/comments.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
